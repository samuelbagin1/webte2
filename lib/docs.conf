# ============================================================
# VPS SERVER — add this to node22.webte.fei.stuba.sk config
# ============================================================
#
# File: /etc/nginx/sites-available/node22.webte.fei.stuba.sk
#
# ADD these blocks BELOW the task1and2 section
# and ABOVE the "# === global rules ===" section
#
# Then run:
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================


    # === zapocet ===
    # zapocet backend API
    location ~ ^/zapocet(/api/.*)$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/node22.webte.fei.stuba.sk/zapocet/backend/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $1;
    }

    # zapocet frontend (HTML + JS)
    location /zapocet/ {
        alias /var/www/node22.webte.fei.stuba.sk/zapocet/frontend/;
        index index.html;
        try_files $uri $uri/ /zapocet/index.html;
    }


