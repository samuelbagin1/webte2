<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletes</title>
</head>
<body>
    <h1>Athletes</h1>
 
    <h2>Add Athlete</h2>
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="last_name" placeholder="Last Name">
    <input type="text" id="sport" placeholder="Sport">
    <button onclick="postAthlete()">Add</button>
 
    <h2>Get Athlete by ID</h2>
    <input type="number" id="getId" placeholder="ID">
    <button onclick="getAthleteById()">Search</button>
    <div id="athleteDetail"></div>
 
    <h2>Delete Athlete</h2>
    <input type="number" id="deleteId" placeholder="ID">
    <button onclick="deleteAthlete()">Delete</button>
 
    <h2>All Athletes</h2>
    <div id="athletes">Loading...</div>

    
    <script src="docs.js"></script>
</body>
</html>
